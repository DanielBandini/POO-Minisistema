<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FecapStudy</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <aside>
    <header>
      <h1>FecapStudy</h1>
      <p id="servidor">verificando servidor...</p>
    </header>

    <section id="perfis" aria-label="Perfis"></section>

    <section aria-label="Meta da semana">
      <output id="xp">0 XP</output>
      <label>Meta da semana
        <progress id="barra" max="100" value="0"></progress>
      </label>
      <p id="textoMeta"></p>
    </section>
  </aside>

  <main>
    <form id="formSessao">
      <h2>Nova sessão</h2>
      <fieldset id="modos">
        <legend>Modalidade</legend>
        <label><input type="radio" name="modo" value="Pomodoro" checked> Pomodoro</label>
        <label><input type="radio" name="modo" value="Exercicios"> Exercícios</label>
        <label><input type="radio" name="modo" value="Leitura"> Leitura</label>
      </fieldset>
      <label>Disciplina <select id="disciplina"></select></label>
      <label>Minutos <input type="number" id="minutos" value="50"></label>
      <fieldset id="extras"></fieldset>
      <button>Registrar</button>
      <output id="avisos"></output>
    </form>

    <form id="formHorario">
      <h2>Estudei das... às...</h2>
      <p>Registra uma leitura com resumo na disciplina escolhida ao lado.</p>
      <label>Hora de início (0 a 23) <input type="number" id="inicio" value="14"></label>
      <label>Hora de fim <input type="number" id="fim" value="16"></label>
      <label>Páginas lidas <input type="number" id="paginas" value="20"></label>
      <button class="contorno">Registrar por horário</button>
    </form>

    <section>
      <h2>Histórico</h2>
      <ol id="historico"></ol>
    </section>

    <section>
      <h2>Alertas para o responsável</h2>
      <label>Canal
        <select id="canal">
          <option value="email">E-mail</option>
          <option value="sms">SMS</option>
        </select>
      </label>
      <button id="alertar">Enviar alerta</button>
      <ul id="caixaSaida"></ul>
    </section>

    <section>
      <h2 id="tituloTrilha">Trilha</h2>
      <ul id="trilha"></ul>
    </section>

    <section>
      <h2>Cronograma</h2>
      <ul id="plano"></ul>
    </section>

    <section class="largo">
      <h2>Banco de dados</h2>
      <button id="verSessoes">Sessões salvas</button>
      <button id="verRelatorio" class="contorno">Relatório</button>
      <figure id="resultado"></figure>
    </section>
  </main>

  <script src="classes.js"></script>
  <script src="app.js"></script>
</body>
</html>
